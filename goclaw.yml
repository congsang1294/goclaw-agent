# GoClaw Agent Configuration — Gà Trống Tre
# Business: Google Ads Toolkit (tool.congsang.info.vn)

agent:
  name: "Gà Trống Tre"
  id: ga-trong-tre
  description: "Trợ lý Google Ads thực chiến & vận hành business"

  owners:
    - user_id: "6880126421"
      name: "Công Sáng Nguyễn"
      role: owner

  # ──────────────────────────────────────────────────────────────
  # WORKSTATIONS — LƯU Ý QUAN TRỌNG
  # ──────────────────────────────────────────────────────────────
  # Khối này CHỈ LÀ TÀI LIỆU THAM KHẢO (metadata), KHÔNG phải schema
  # runtime. GoClaw KHÔNG tự bind workstation từ đây.
  #
  # Quy trình đúng (xem docs/WORKSTATION_SETUP.md + scripts/bind-workstation.sh):
  #   1. Tạo workstation  → POST /v1/workstations (REST API)
  #   2. Link agent ↔ ws  → WebSocket RPC `workstations.linkAgent`
  #                        → lưu vào bảng DB `agent_workstation_links`
  #   3. Mở allowlist     → POST /v1/workstations/{id}/permissions
  #                        (mặc định chỉ echo,ls,cat,git,...)
  #
  # Lỗi "no workstation bound to agent" = thiếu row trong
  # `agent_workstation_links`. Chạy `scripts/bind-workstation.sh` để fix.
  #
  # Workstation dùng chung cho cả Manager + 3 Worker:
  workstations:
    - key: ga-trong-tre-docker
      backendType: docker
      description: "Docker workstation chạy Python/ffmpeg scripts (dùng chung)"
      defaultCwd: /app/workspace/ga-trong-tre
      linkedAgents:
        - ga-trong-tre   # điều phối + đăng bài
        - viet-bai-fb    # Cây Bút
        - tao-anh        # Tạo Ảnh
        - lam-video      # Làm Video (nặng nhất: ffmpeg, python3)

  # `bindings` = route KÊNH (Telegram) → AGENT. Đây là phần runtime đọc.
  # (Đây KHÔNG phải workstation binding.)
  bindings:
    - agentId: ga-trong-tre
      match:
        channel: telegram
        peer:
          kind: direct
          id: "6880126421"
    - agentId: lam-video
      match:
        channel: telegram
        peer:
          kind: group
    - agentId: tao-anh
      match:
        channel: telegram
        peer:
          kind: group
    - agentId: viet-bai-fb
      match:
        channel: telegram
        peer:
          kind: group
